name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: Tag must match Cargo.toml version
        shell: pwsh
        run: |
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          $tag = "${{ github.ref_name }}".TrimStart('v')
          if ($cargo -ne $tag) { throw "Tag v$tag does not match Cargo.toml version $cargo" }
          "VERSION=$cargo" | Out-File -FilePath $env:GITHUB_ENV -Append

      - run: cargo test
      - run: cargo build --release

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$env:VERSION" "/DExeDir=$PWD\target\release" "/DOutDir=$PWD\dist" installer\setup.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          $hash = (Get-FileHash dist\rust-window-setup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  rust-window-setup.exe" | Out-File dist\rust-window-setup.exe.sha256 -Encoding ascii

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist\rust-window-setup.exe dist\rust-window-setup.exe.sha256 --title "${{ github.ref_name }}" --generate-notes
